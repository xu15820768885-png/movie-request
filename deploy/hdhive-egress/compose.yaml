services:
  hdhive-egress:
    image: ubuntu/squid:latest
    container_name: hdhive-egress
    ports:
      - "3128:3128"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ./passwords:/etc/squid/passwords:ro
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
