services:
  movie-request:
    image: ghcr.mirrorify.net/xu15820768885-png/movie-request:latest
    container_name: movie-request
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      PORT: 5056
      HTTP_PROXY: http://192.168.31.129:7890
      HTTPS_PROXY: http://192.168.31.129:7890
      NO_PROXY: localhost,127.0.0.1,192.168.31.0/24
      # 影巢试运行：先开放管理员 OAuth/测速，确认后再启动追更后台。
      HDHIVE_FEATURE_ENABLED: ${HDHIVE_FEATURE_ENABLED:-true}
      HDHIVE_BACKGROUND_ENABLED: ${HDHIVE_BACKGROUND_ENABLED:-false}
      HDHIVE_BASE_URL: ${HDHIVE_BASE_URL:-https://re0.me}
      HDHIVE_PROXY_URL: ${HDHIVE_PROXY_URL:-}
    ports:
      - "1802:5056"
    volumes:
      - /volume1/docker/movie-request/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5056/api/health', timeout=3)"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
